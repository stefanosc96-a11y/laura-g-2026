<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Festa di laurea 📸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Dawning+of+a+New+Day&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#3a0d16; --accent:#7b1e2b; --accent-soft:#f6e9eb; --muted:#8c5a63; --card:#fff; --line:#e6cfd3;
          --lcd:#ff9a2e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .hidden { display:none !important; }
  button { font-family:inherit; }

  /* ---------- Home ---------- */
  #home { min-height:100%; display:flex; justify-content:center; }
  #home main { width:100%; max-width:440px; padding:24px 16px 32px; text-align:center; }
  .icon { font-size:48px; }
  h1 { font-family:"Dawning of a New Day",cursive; font-weight:normal; color:var(--accent); font-size:46px; line-height:.9; margin:14px 0 26px; }
  .sub { color:var(--muted); margin:0 0 30px; font-size:15px; line-height:1.45; }
  .btn { display:block; width:100%; padding:19px; border:0; border-radius:14px; font-size:17px; font-weight:600;
         line-height:1; margin-bottom:12px; cursor:pointer; user-select:none; }
  .btn:active { transform:scale(.98); }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:var(--card); color:var(--accent); border:1.5px solid var(--accent); }
  .name { margin-top:22px; font-size:14px; color:var(--muted); }
  .name input { margin-top:8px; width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
                font-size:16px; background:var(--card); color:var(--ink); text-align:center; }
  .frame { position:relative; padding:46px 30px 40px; }
  .frame svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .frame > *:not(svg) { position:relative; }
  #camHelp { margin-top:18px; padding:14px 16px; border:1.5px solid var(--accent); border-radius:14px; background:var(--accent-soft);
             font-size:14px; line-height:1.45; text-align:left; color:var(--ink); }
  #camHelp b { color:var(--accent); }
  #camHelp .btn { margin:12px 0 0; padding:14px; font-size:15px; line-height:1.25; text-align:center; }
  #camHelp code { font-size:11px; color:var(--muted); }
  .closed { font-size:19px; line-height:1.5; color:var(--accent); font-weight:600; margin:10px 0 24px; }
  #homeStatus { margin-top:22px; font-size:15px; min-height:22px; line-height:1.4; }

  /* ---------- Fotocamera ---------- */
  #cam { position:fixed; inset:0; height:100dvh; background:#fff; color:var(--ink); z-index:10; display:flex; flex-direction:column; }
  .top { padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; justify-content:space-between;
         align-items:center; gap:10px; }
  .round { width:42px; height:42px; flex:0 0 42px; border-radius:50%; border:0; background:var(--accent-soft); color:var(--accent);
           font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .round.on { background:var(--accent); color:#fff; }
  #camStatus { font-size:13px; color:var(--muted); text-align:center; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #viewfinder { position:relative; flex:1; margin:0 10px; border-radius:18px; overflow:hidden; background:#000;
                box-shadow:0 0 0 2px var(--accent); }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirror { transform:scaleX(-1); }
  .ov { position:absolute; inset:0; pointer-events:none; }
  #vig { background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); opacity:0; transition:opacity .3s; }
  #grain { opacity:0; mix-blend-mode:overlay; background-size:160px 160px; animation:grain .5s steps(4) infinite; }
  @keyframes grain { 0%{background-position:0 0} 25%{background-position:-40px 30px} 50%{background-position:30px -50px} 75%{background-position:-60px -20px} 100%{background-position:0 0} }
  #dateStamp { position:absolute; left:16px; bottom:14px; font-family:"VT323",monospace; font-size:30px; color:var(--lcd);
               text-shadow:0 0 6px rgba(255,120,0,.9); letter-spacing:2px; pointer-events:none; }
  #flash { background:#fff; opacity:0; transition:opacity .35s; }
  #flash.on { opacity:.9; transition:none; }
  #toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(0,0,0,.6);
           padding:7px 14px; border-radius:16px; font-size:14px; white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  #screenFlash { position:fixed; inset:0; background:#fff7ee; z-index:50; opacity:0; pointer-events:none; transition:opacity .15s; }
  #screenFlash.on { opacity:1; transition:none; }

  #filters { display:flex; gap:8px; padding:14px 10px 4px; overflow-x:auto; scrollbar-width:none; }
  #filters::-webkit-scrollbar { display:none; }
  .chip:first-child { margin-left:auto; } .chip:last-child { margin-right:auto; }
  .chip { flex:0 0 auto; border:1.5px solid var(--accent); background:#fff; color:var(--accent); border-radius:16px;
          padding:9px 20px; font-size:14px; cursor:pointer; }
  .chip.sel { background:var(--accent); color:#fff; font-weight:600; }

  .bottom { padding:12px 28px calc(env(safe-area-inset-bottom) + 20px); display:flex; justify-content:space-between; align-items:center; }
  #shutter { width:76px; height:76px; border-radius:50%; border:4px solid var(--accent); background:var(--accent);
             cursor:pointer; padding:0; box-shadow:0 0 0 4px #fff inset; }
  #shutter:active { transform:scale(.93); filter:brightness(1.2); }
  #thumb { width:52px; height:52px; border-radius:10px; border:2px solid var(--accent); background:var(--accent-soft) center/cover; position:relative; cursor:pointer; }
  #badge { position:absolute; right:-8px; top:-8px; min-width:22px; height:22px; border-radius:11px; background:var(--accent);
           font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; padding:0 6px; }
  #counter { width:52px; height:52px; border-radius:10px; background:var(--accent); border:2px solid var(--accent);
             display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:.9; }
  #counter b { font-family:"VT323",monospace; font-weight:normal; font-size:30px; color:#fff; }
  .side { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .side small { font-size:11px; color:var(--muted); }
  #galIcon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  #thumb.has #galIcon { display:none; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <main>
   <div class="frame" id="frame">
    <svg id="frameSvg" aria-hidden="true"><path id="framePath" fill="#fff" stroke="var(--accent)" stroke-width="7" stroke-linejoin="round"/></svg>
    <div class="icon">📸</div>
    <h1>La tua macchina analogica</h1>
    <p class="sub">I caricamenti sono chiusi.</p>

    <p class="closed">Il rullino è finito 🎞️<br>Grazie a tutti per le foto!</p>
    <div id="camHelp" class="hidden"></div>
    <div id="homeStatus"></div>
   </div>
  </main>
</section>

<!-- FOTOCAMERA -->
<div id="screenFlash"></div>
<section id="cam" class="hidden">
  <div class="top">
    <button class="round" id="closeCam" aria-label="Chiudi">✕</button>
    <button class="round hidden" id="torch" aria-label="Flash">⚡</button>
    <div id="camStatus">Pronta</div>
    <button class="round" id="flip" aria-label="Cambia fotocamera">⟲</button>
  </div>

  <div id="viewfinder">
    <video id="video" playsinline autoplay muted></video>
    <div class="ov" id="vig"></div>
    <div class="ov" id="grain"></div>
    <div id="dateStamp" class="hidden"></div>
    <div class="ov" id="flash"></div>
    <div id="toast"></div>
  </div>

  <div id="filters"></div>

  <div class="bottom">
    <div class="side"><div id="thumb"><span id="badge" class="hidden"></span><span id="galIcon">🖼️</span></div><small>Galleria</small></div>
    <button id="shutter" aria-label="Scatta"></button>
    <div class="side"><div id="counter"><b id="shots">00</b></div><small>Scatti</small></div>
  </div>
</section>

<script>
  const $ = id => document.getElementById(id);
  // ---------- Cornice ondulata ----------
  function drawFrame() {
    const el = $('frame'), w = el.offsetWidth, h = el.offsetHeight;
    const m = 6, amp = 9, wl = 64, r = 22, step = 3;
    const pts = [];
    function edge(x0, y0, x1, y1, nx, ny) {          // nx,ny = verso l'interno
      const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / wl));
      const k = Math.ceil(len / step);
      for (let i = 0; i <= k; i++) {
        const t = i / k, d = amp * (1 - Math.cos(2 * Math.PI * n * t)) / 2;
        pts.push([x0 + (x1 - x0) * t + nx * d, y0 + (y1 - y0) * t + ny * d]);
      }
    }
    let p = '';
    const L = m, T = m, Rr = w - m, B = h - m;
    pts.length = 0; edge(L + r, T, Rr - r, T, 0, 1);  p += 'M' + pts.map(q => q.join(',')).join('L');
    p += 'Q' + Rr + ',' + T + ' ' + Rr + ',' + (T + r);
    pts.length = 0; edge(Rr, T + r, Rr, B - r, -1, 0); p += 'L' + pts.map(q => q.join(',')).join('L');
    p += 'Q' + Rr + ',' + B + ' ' + (Rr - r) + ',' + B;
    pts.length = 0; edge(Rr - r, B, L + r, B, 0, -1); p += 'L' + pts.map(q => q.join(',')).join('L');
    p += 'Q' + L + ',' + B + ' ' + L + ',' + (B - r);
    pts.length = 0; edge(L, B - r, L, T + r, 1, 0);  p += 'L' + pts.map(q => q.join(',')).join('L');
    p += 'Q' + L + ',' + T + ' ' + (L + r) + ',' + T + 'Z';
    $('framePath').setAttribute('d', p);
  }
  try { new ResizeObserver(drawFrame).observe($('frame')); } catch (e) { window.addEventListener('resize', drawFrame); }
  drawFrame();

</script>
</body>
</html>
