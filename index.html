<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<title>Festa di laurea 📸</title>
<style>
  :root { --bg:#faf6f0; --ink:#2b2420; --accent:#b5442b; --muted:#8a7d72; --card:#fff; --line:#ddd2c6; --ok:#3f7d4e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .hidden { display:none !important; }

  /* ---------- Home ---------- */
  #home { min-height:100%; display:flex; justify-content:center; }
  #home main { width:100%; max-width:440px; padding:44px 20px 40px; text-align:center; }
  .icon { font-size:48px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:32px; margin:6px 0; }
  .sub { color:var(--muted); margin:0 0 30px; font-size:15px; line-height:1.45; }
  .btn { display:block; width:100%; padding:19px; border:0; border-radius:14px; font-family:inherit; font-size:17px; font-weight:600; line-height:1; margin-bottom:12px; cursor:pointer; user-select:none; }
  .btn:active { transform:scale(.98); }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .name { margin-top:22px; font-size:14px; color:var(--muted); }
  .name input { margin-top:8px; width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
                font-size:16px; background:var(--card); color:var(--ink); text-align:center; }
  #homeStatus { margin-top:22px; font-size:15px; min-height:22px; line-height:1.4; }

  /* ---------- Fotocamera ---------- */
  #cam { position:fixed; inset:0; background:#000; color:#fff; z-index:10; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirror { transform:scaleX(-1); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  #flash.on { opacity:.85; transition:none; }
  .top { position:absolute; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
         display:flex; justify-content:space-between; align-items:center;
         background:linear-gradient(rgba(0,0,0,.55),transparent); }
  .pill { background:rgba(0,0,0,.45); border-radius:20px; padding:8px 14px; font-size:14px; }
  .round { width:44px; height:44px; border-radius:50%; border:0; background:rgba(0,0,0,.45); color:#fff;
           font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .bottom { position:absolute; left:0; right:0; bottom:0; padding:20px 28px calc(env(safe-area-inset-bottom) + 26px);
            display:flex; justify-content:space-between; align-items:center;
            background:linear-gradient(transparent,rgba(0,0,0,.6)); }
  #shutter { width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.25);
             cursor:pointer; padding:0; }
  #shutter:active { background:rgba(255,255,255,.7); transform:scale(.94); }
  #thumb { width:52px; height:52px; border-radius:10px; border:2px solid #fff; background:#222 center/cover;
           position:relative; }
  #thumb .badge { position:absolute; right:-8px; top:-8px; min-width:22px; height:22px; border-radius:11px;
                  background:var(--accent); font-size:12px; font-weight:700; display:flex; align-items:center;
                  justify-content:center; padding:0 6px; }
  #toast { position:absolute; left:50%; top:calc(env(safe-area-inset-top) + 70px); transform:translateX(-50%);
           background:rgba(0,0,0,.65); padding:8px 14px; border-radius:18px; font-size:14px; white-space:nowrap;
           opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <main>
    <div class="icon">📸</div>
    <h1>Festa di laurea</h1>
    <p class="sub">Scatta quante foto vuoi: arrivano tutte nell'album della festa.<br>Le vedremo insieme dopo!</p>

    <button class="btn primary" id="openCam">Apri la fotocamera</button>
    <label class="btn secondary" for="gal">Carica dalla galleria</label>
    <input class="hidden" type="file" id="gal" accept="image/*,video/*" multiple>
    <input class="hidden" type="file" id="nativeCam" accept="image/*" capture="environment">

    <div class="name">
      Firma le tue foto (facoltativo)
      <input type="text" id="guest" placeholder="Il tuo nome" maxlength="30" autocomplete="given-name">
    </div>

    <div id="homeStatus"></div>
  </main>
</section>

<!-- FOTOCAMERA -->
<section id="cam" class="hidden">
  <video id="video" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div class="top">
    <button class="round" id="closeCam" aria-label="Chiudi">✕</button>
    <div class="pill" id="camStatus">Pronta</div>
    <button class="round" id="flip" aria-label="Cambia fotocamera">⟲</button>
  </div>
  <div id="toast"></div>
  <div class="bottom">
    <div id="thumb"><span class="badge hidden" id="badge"></span></div>
    <button id="shutter" aria-label="Scatta"></button>
    <div style="width:52px"></div>
  </div>
</section>

<script>
  // ====== CONFIGURAZIONE ======
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwVyoclhGCln1D1F1eE5To9iPLRSzWK1JO9i1w3Q2JxFsq6dXORlvXsWf0o88-BpscD5Q/exec';
  const MAX_SIDE = 2560;     // lato lungo massimo delle foto inviate (px)
  const QUALITY = 0.85;      // qualità JPEG
  const MAX_VIDEO_MB = 30;   // i video non vengono compressi
  const PARALLEL = 3;        // caricamenti contemporanei
  // ============================

  const $ = id => document.getElementById(id);
  const guestEl = $('guest');
  function load(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  guestEl.value = load('guest', '');
  guestEl.addEventListener('input', () => store('guest', guestEl.value));

  // ---------- Coda di caricamento in background ----------
  const queue = [];
  let active = 0, sent = 0, failed = 0, lastError = '';

  function pending() { return queue.length + active; }

  function updateStatus() {
    const p = pending();
    let txt;
    if (p) txt = '⏳ ' + p + ' in caricamento' + (sent ? ' · ✓ ' + sent + ' inviate' : '');
    else if (sent) txt = '✓ ' + sent + (sent === 1 ? ' foto inviata' : ' foto inviate');
    else txt = 'Pronta';
    if (failed && !p) txt += ' · ⚠️ ' + failed + ' non inviate';
    $('camStatus').textContent = txt;

    let home = '';
    if (p) home = '⏳ Sto caricando ' + p + (p === 1 ? ' file' : ' file') + '… puoi continuare a scattare.';
    else if (sent) home = '✅ ' + sent + (sent === 1 ? ' foto inviata' : ' foto inviate') + '. Grazie!';
    if (failed && !p) home += ' ⚠️ ' + failed + ' non inviate: riprova più tardi.' + (lastError ? ' [' + lastError + ']' : '');
    $('homeStatus').textContent = home;

    const b = $('badge');
    if (p) { b.textContent = p; b.classList.remove('hidden'); } else b.classList.add('hidden');
  }

  function enqueue(item) { item.tries = 0; queue.push(item); updateStatus(); pump(); }

  function pump() {
    while (active < PARALLEL && queue.length) {
      const item = queue.shift();
      active++;
      send(item).then(() => { sent++; })
        .catch(err => {
          item.tries++;
          lastError = (err && err.message) ? err.message : String(err);
          if (item.tries < 3) setTimeout(() => { queue.push(item); updateStatus(); pump(); }, 2000 * item.tries);
          else failed++;
        })
        .finally(() => { active--; updateStatus(); pump(); });
    }
  }

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej(new Error('lettura file non riuscita'));
      r.readAsDataURL(blob);
    });
  }

  async function send(item) {
    const b64 = await blobToBase64(item.blob);
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      credentials: 'omit',
      body: JSON.stringify({ data: b64, name: item.name, mimeType: item.blob.type || 'image/jpeg', guest: guestEl.value })
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'errore sconosciuto');
  }

  window.addEventListener('beforeunload', e => { if (pending()) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Compressione ----------
  function canvasToJpeg(canvas) {
    return new Promise(res => canvas.toBlob(res, 'image/jpeg', QUALITY));
  }

  function fit(w, h) {
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    return [Math.round(w * s), Math.round(h * s)];
  }

  async function compressFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const [w, h] = fit(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await canvasToJpeg(c);
      if (!blob || blob.size >= file.size) return file;   // se non conviene, invia l'originale
      return blob;
    } catch (e) {
      return file;                                         // formato non decodificabile: invia l'originale
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function baseName(n) { return String(n || 'foto').replace(/\.[^.]+$/, ''); }
  function stamp() { const d = new Date(); return d.toTimeString().slice(0, 8).replace(/:/g, ''); }

  async function handleFiles(files) {
    for (const f of files) {
      if (f.type.startsWith('video/')) {
        if (f.size > MAX_VIDEO_MB * 1048576) { lastError = 'video oltre ' + MAX_VIDEO_MB + ' MB saltato'; failed++; updateStatus(); continue; }
        enqueue({ blob: f, name: f.name || 'video.mp4' });
      } else {
        const blob = await compressFile(f);
        enqueue({ blob, name: blob === f ? (f.name || 'foto.jpg') : baseName(f.name) + '.jpg' });
      }
    }
  }

  $('gal').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fs); });
  $('nativeCam').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fs); });

  // ---------- Fotocamera nella pagina ----------
  const video = $('video');
  let stream = null, facing = 'environment';

  async function startStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play();
  }

  async function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('nativeCam').click(); return; }
    $('cam').classList.remove('hidden');
    try {
      await startStream();
    } catch (e) {
      // Permesso negato o fotocamera non disponibile: usa la fotocamera di sistema
      closeCam();
      $('homeStatus').textContent = 'Fotocamera della pagina non disponibile: uso quella del telefono.';
      $('nativeCam').click();
    }
  }

  function closeCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $('cam').classList.add('hidden');
    updateStatus();
  }

  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1200);
  }

  async function shoot() {
    if (!video.videoWidth) return;
    const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
    const [w, h] = fit(video.videoWidth, video.videoHeight);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }   // selfie come nell'anteprima
    ctx.drawImage(video, 0, 0, w, h);
    const blob = await canvasToJpeg(c);
    if (!blob) { toast('Scatto non riuscito, riprova'); return; }
    $('thumb').style.backgroundImage = 'url(' + URL.createObjectURL(blob) + ')';
    toast('📸 Scattata!');
    enqueue({ blob, name: 'scatto_' + stamp() + '.jpg' });
  }

  $('openCam').addEventListener('click', openCam);
  $('closeCam').addEventListener('click', closeCam);
  $('shutter').addEventListener('click', shoot);
  $('flip').addEventListener('click', async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await startStream(); } catch (e) { toast('Impossibile cambiare fotocamera'); }
  });
  $('thumb').addEventListener('click', closeCam);

  updateStatus();
</script>
</body>
</html>
