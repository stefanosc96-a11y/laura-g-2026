<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<title>Festa di laurea 📸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf6f0; --ink:#2b2420; --accent:#b5442b; --muted:#8a7d72; --card:#fff; --line:#ddd2c6;
          --lcd:#ff9a2e; --body:#141210; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .hidden { display:none !important; }
  button { font-family:inherit; }

  /* ---------- Home ---------- */
  #home { min-height:100%; display:flex; justify-content:center; }
  #home main { width:100%; max-width:440px; padding:44px 20px 40px; text-align:center; }
  .icon { font-size:48px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:32px; margin:6px 0; }
  .sub { color:var(--muted); margin:0 0 30px; font-size:15px; line-height:1.45; }
  .btn { display:block; width:100%; padding:19px; border:0; border-radius:14px; font-size:17px; font-weight:600;
         line-height:1; margin-bottom:12px; cursor:pointer; user-select:none; }
  .btn:active { transform:scale(.98); }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .name { margin-top:22px; font-size:14px; color:var(--muted); }
  .name input { margin-top:8px; width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
                font-size:16px; background:var(--card); color:var(--ink); text-align:center; }
  #homeStatus { margin-top:22px; font-size:15px; min-height:22px; line-height:1.4; }

  /* ---------- Fotocamera ---------- */
  #cam { position:fixed; inset:0; background:var(--body); color:#fff; z-index:10; display:flex; flex-direction:column; }
  .top { padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; justify-content:space-between;
         align-items:center; gap:10px; }
  .round { width:42px; height:42px; flex:0 0 42px; border-radius:50%; border:0; background:#2a2622; color:#fff;
           font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .round.on { background:var(--lcd); color:#000; }
  #camStatus { font-size:13px; color:#cfc6bc; text-align:center; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #viewfinder { position:relative; flex:1; margin:0 10px; border-radius:18px; overflow:hidden; background:#000;
                box-shadow:inset 0 0 0 2px #2a2622; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirror { transform:scaleX(-1); }
  .ov { position:absolute; inset:0; pointer-events:none; }
  #vig { background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); opacity:0; transition:opacity .3s; }
  #grain { opacity:0; mix-blend-mode:overlay; background-size:160px 160px; animation:grain .5s steps(4) infinite; }
  @keyframes grain { 0%{background-position:0 0} 25%{background-position:-40px 30px} 50%{background-position:30px -50px} 75%{background-position:-60px -20px} 100%{background-position:0 0} }
  #dateStamp { position:absolute; right:16px; bottom:14px; font-family:"VT323",monospace; font-size:30px; color:var(--lcd);
               text-shadow:0 0 6px rgba(255,120,0,.9); letter-spacing:2px; pointer-events:none; }
  #flash { background:#fff; opacity:0; transition:opacity .35s; }
  #flash.on { opacity:.9; transition:none; }
  #toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(0,0,0,.6);
           padding:7px 14px; border-radius:16px; font-size:14px; white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }

  #filters { display:flex; gap:8px; padding:14px 10px 4px; overflow-x:auto; scrollbar-width:none; }
  #filters::-webkit-scrollbar { display:none; }
  .chip:first-child { margin-left:auto; } .chip:last-child { margin-right:auto; }
  .chip { flex:0 0 auto; border:1px solid #3a342e; background:transparent; color:#cfc6bc; border-radius:16px;
          padding:8px 12px; font-size:13px; cursor:pointer; }
  .chip.sel { background:var(--lcd); border-color:var(--lcd); color:#000; font-weight:600; }

  .bottom { padding:12px 28px calc(env(safe-area-inset-bottom) + 20px); display:flex; justify-content:space-between; align-items:center; }
  #shutter { width:76px; height:76px; border-radius:50%; border:5px solid #e9e2da; background:var(--accent);
             cursor:pointer; padding:0; box-shadow:0 0 0 3px #2a2622 inset; }
  #shutter:active { transform:scale(.93); filter:brightness(1.2); }
  #thumb { width:52px; height:52px; border-radius:10px; border:2px solid #e9e2da; background:#2a2622 center/cover; position:relative; cursor:pointer; }
  #badge { position:absolute; right:-8px; top:-8px; min-width:22px; height:22px; border-radius:11px; background:var(--accent);
           font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 6px; }
  #counter { width:52px; height:52px; border-radius:10px; background:#0b0a09; border:2px solid #2a2622;
             display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:.9; }
  #counter b { font-family:"VT323",monospace; font-weight:normal; font-size:30px; color:var(--lcd); text-shadow:0 0 5px rgba(255,120,0,.7); }
  #counter span { font-size:8px; color:#8a7d72; letter-spacing:1px; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <main>
    <div class="icon">📸</div>
    <h1>Festa di laurea</h1>
    <p class="sub">Scatta quante foto vuoi: arrivano tutte nell'album della festa.<br>Le vedremo insieme dopo!</p>

    <button class="btn primary" id="openCam">Apri la fotocamera</button>
    <label class="btn secondary" for="gal">Carica dalla galleria</label>
    <input class="hidden" type="file" id="gal" accept="image/*,video/*" multiple>
    <input class="hidden" type="file" id="nativeCam" accept="image/*" capture="environment">

    <div class="name">
      Firma le tue foto (facoltativo)
      <input type="text" id="guest" placeholder="Il tuo nome" maxlength="30" autocomplete="given-name">
    </div>

    <div id="homeStatus"></div>
  </main>
</section>

<!-- FOTOCAMERA -->
<section id="cam" class="hidden">
  <div class="top">
    <button class="round" id="closeCam" aria-label="Chiudi">✕</button>
    <button class="round hidden" id="torch" aria-label="Flash">⚡</button>
    <div id="camStatus">Pronta</div>
    <button class="round" id="flip" aria-label="Cambia fotocamera">⟲</button>
  </div>

  <div id="viewfinder">
    <video id="video" playsinline autoplay muted></video>
    <div class="ov" id="vig"></div>
    <div class="ov" id="grain"></div>
    <div id="dateStamp" class="hidden"></div>
    <div class="ov" id="flash"></div>
    <div id="toast"></div>
  </div>

  <div id="filters"></div>

  <div class="bottom">
    <div id="thumb"><span id="badge" class="hidden"></span></div>
    <button id="shutter" aria-label="Scatta"></button>
    <div id="counter"><b id="shots">00</b><span>SCATTI</span></div>
  </div>
</section>

<script>
  // ====== CONFIGURAZIONE ======
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwVyoclhGCln1D1F1eE5To9iPLRSzWK1JO9i1w3Q2JxFsq6dXORlvXsWf0o88-BpscD5Q/exec';
  const MAX_SIDE = 2560;     // lato lungo massimo delle foto inviate (px)
  const QUALITY = 0.86;      // qualità JPEG
  const MAX_VIDEO_MB = 30;   // i video non vengono compressi
  const PARALLEL = 3;        // caricamenti contemporanei
  const DEFAULT_FILTER = 'usaegetta';
  // ============================

  // ---------- Filtri ----------
  // curve: [nero, bianco, gamma] per canale R,G,B  ·  contrast: -1..1  ·  sat: saturazione
  const FILTERS = [
    { id:'usaegetta', label:'Usa e getta', css:'sepia(.22) saturate(1.3) contrast(1.06) brightness(1.04) hue-rotate(-6deg)',
      r:[16,255,.92], g:[10,246,.97], b:[22,222,1.06], contrast:.08, sat:1.12, grain:20, vignette:.42, leak:true, date:true },
    { id:'anni70', label:"Anni '70", css:'sepia(.4) saturate(.85) contrast(.9) brightness(1.08)',
      r:[34,248,.9], g:[26,236,.95], b:[44,206,1.0], contrast:-.1, sat:.78, grain:12, vignette:.32, leak:true, date:false },
    { id:'bn', label:'Bianco e nero', css:'grayscale(1) contrast(1.25) brightness(1.03)',
      r:[8,250,1], g:[8,250,1], b:[8,250,1], contrast:.22, sat:0, grain:24, vignette:.38, leak:false, date:false },
    { id:'naturale', label:'Naturale', css:'none', none:true }
  ];

  const $ = id => document.getElementById(id);
  function load(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  const guestEl = $('guest');
  guestEl.value = load('guest', '');
  guestEl.addEventListener('input', () => store('guest', guestEl.value));

  let filter = FILTERS.find(f => f.id === load('filter', DEFAULT_FILTER)) || FILTERS[0];
  let shots = +load('shots', 0) || 0;

  // ---------- Coda di caricamento in background ----------
  const queue = [];
  let active = 0, sent = 0, failed = 0, lastError = '';
  const pending = () => queue.length + active;

  function updateStatus() {
    const p = pending();
    let txt;
    if (p) txt = '⏳ ' + p + ' in caricamento' + (sent ? ' · ✓ ' + sent : '');
    else if (sent) txt = '✓ ' + sent + (sent === 1 ? ' foto inviata' : ' foto inviate');
    else txt = 'Pronta';
    if (failed && !p) txt += ' · ⚠️ ' + failed + ' non inviate';
    $('camStatus').textContent = txt;

    let home = '';
    if (p) home = '⏳ Sto caricando ' + p + ' file… puoi continuare a scattare.';
    else if (sent) home = '✅ ' + sent + (sent === 1 ? ' foto inviata' : ' foto inviate') + '. Grazie!';
    if (failed && !p) home += ' ⚠️ ' + failed + ' non inviate: riprova più tardi.' + (lastError ? ' [' + lastError + ']' : '');
    $('homeStatus').textContent = home;

    const b = $('badge');
    if (p) { b.textContent = p; b.classList.remove('hidden'); } else b.classList.add('hidden');
    $('shots').textContent = String(shots).padStart(2, '0');
  }

  function enqueue(item) { item.tries = 0; queue.push(item); updateStatus(); pump(); }

  function pump() {
    while (active < PARALLEL && queue.length) {
      const item = queue.shift();
      active++;
      send(item).then(() => { sent++; })
        .catch(err => {
          item.tries++;
          lastError = (err && err.message) ? err.message : String(err);
          if (item.tries < 3) setTimeout(() => { queue.push(item); updateStatus(); pump(); }, 2000 * item.tries);
          else failed++;
        })
        .finally(() => { active--; updateStatus(); pump(); });
    }
  }

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej(new Error('lettura file non riuscita'));
      r.readAsDataURL(blob);
    });
  }

  async function send(item) {
    const b64 = await blobToBase64(item.blob);
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      credentials: 'omit',
      body: JSON.stringify({ data: b64, name: item.name, mimeType: item.blob.type || 'image/jpeg', guest: guestEl.value })
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'errore sconosciuto');
  }

  window.addEventListener('beforeunload', e => { if (pending()) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Utilità immagine ----------
  const canvasToJpeg = c => new Promise(res => c.toBlob(res, 'image/jpeg', QUALITY));
  function fit(w, h) { const s = Math.min(1, MAX_SIDE / Math.max(w, h)); return [Math.round(w * s), Math.round(h * s)]; }
  const baseName = n => String(n || 'foto').replace(/\.[^.]+$/, '');
  const hhmmss = () => new Date().toTimeString().slice(0, 8).replace(/:/g, '');
  function dateText() {
    const d = new Date();
    return "'" + String(d.getFullYear()).slice(2) + ' ' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + String(d.getDate()).padStart(2, '0');
  }

  function makeLUT([lo, hi, gamma], contrast) {
    const t = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) {
      let x = Math.pow(i / 255, gamma);
      x = 0.5 + (x - 0.5) * (1 + contrast);
      x = Math.min(1, Math.max(0, x));
      t[i] = lo + (hi - lo) * x;
    }
    return t;
  }

  // Applica il filtro scelto al canvas (colore, grana, vignettatura, luce, data)
  function applyFilter(c, f) {
    if (f.none) return;
    const w = c.width, h = c.height, ctx = c.getContext('2d');
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    const lr = makeLUT(f.r, f.contrast), lg = makeLUT(f.g, f.contrast), lb = makeLUT(f.b, f.contrast);
    const sat = f.sat, gr = f.grain;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (sat !== 1) {
        const l = 0.299 * r + 0.587 * g + 0.114 * b;
        r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat;
        r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;
      }
      r = lr[r | 0]; g = lg[g | 0]; b = lb[b | 0];
      if (gr) { const n = (Math.random() - 0.5) * gr; r += n; g += n; b += n; }
      d[i] = r; d[i + 1] = g; d[i + 2] = b;
    }
    ctx.putImageData(img, 0, 0);

    const R = Math.hypot(w, h) / 2;
    if (f.vignette) {
      const v = ctx.createRadialGradient(w / 2, h / 2, R * 0.45, w / 2, h / 2, R);
      v.addColorStop(0, 'rgba(0,0,0,0)');
      v.addColorStop(1, 'rgba(0,0,0,' + f.vignette + ')');
      ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
    }
    if (f.leak && Math.random() < 0.6) {          // bagliore di luce, non su tutte le foto
      const x = Math.random() < 0.5 ? 0 : w, y = Math.random() * h * 0.6;
      const g2 = ctx.createRadialGradient(x, y, 0, x, y, R * (0.5 + Math.random() * 0.4));
      g2.addColorStop(0, 'rgba(255,120,40,.45)');
      g2.addColorStop(0.5, 'rgba(255,70,30,.15)');
      g2.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h); ctx.restore();
    }
    if (f.date) {
      const size = Math.round(Math.min(w, h) * 0.065);
      ctx.save();
      ctx.font = size + 'px "VT323", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.shadowColor = 'rgba(255,110,0,.9)'; ctx.shadowBlur = size * 0.35;
      ctx.fillStyle = '#ff9a2e';
      ctx.fillText(dateText(), w - size * 0.8, h - size * 0.6);
      ctx.restore();
    }
  }

  // ---------- Galleria (foto originali, solo ridimensionate) ----------
  async function compressFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = url; await img.decode();
      const [w, h] = fit(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await canvasToJpeg(c);
      return (!blob || blob.size >= file.size) ? file : blob;
    } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
  }

  async function handleFiles(files) {
    for (const f of files) {
      if (f.type.startsWith('video/')) {
        if (f.size > MAX_VIDEO_MB * 1048576) { lastError = 'video oltre ' + MAX_VIDEO_MB + ' MB saltato'; failed++; updateStatus(); continue; }
        enqueue({ blob: f, name: f.name || 'video.mp4' });
      } else {
        const blob = await compressFile(f);
        enqueue({ blob, name: blob === f ? (f.name || 'foto.jpg') : baseName(f.name) + '.jpg' });
      }
    }
  }
  $('gal').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fs); });
  $('nativeCam').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fs); });

  // ---------- Anteprima filtri ----------
  (function makeGrainTile() {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const ctx = c.getContext('2d'), im = ctx.createImageData(160, 160);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    ctx.putImageData(im, 0, 0);
    $('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

  function renderChips() {
    $('filters').innerHTML = '';
    FILTERS.forEach(f => {
      const b = document.createElement('button');
      b.className = 'chip' + (f === filter ? ' sel' : '');
      b.textContent = f.label;
      b.onclick = () => { filter = f; store('filter', f.id); renderChips(); applyPreview(); };
      $('filters').appendChild(b);
    });
  }

  function applyPreview() {
    $('video').style.filter = filter.css;
    $('vig').style.opacity = filter.none ? 0 : 1;
    $('grain').style.opacity = filter.none ? 0 : Math.min(.2, filter.grain / 110);
    $('dateStamp').textContent = dateText();
    $('dateStamp').classList.toggle('hidden', !filter.date);
  }

  // ---------- Suono dello scatto ----------
  let audio = null;
  function initAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
  function clickSound() {
    if (!audio) return;
    try {
      const len = audio.sampleRate * 0.09, buf = audio.createBuffer(1, len, audio.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        ch[i] = (Math.random() * 2 - 1) * (t < 0.12 ? 1 : (t > 0.55 && t < 0.65 ? 0.7 : 0)) * (1 - t);
      }
      const src = audio.createBufferSource(), gain = audio.createGain();
      gain.gain.value = 0.35; src.buffer = buf; src.connect(gain).connect(audio.destination); src.start();
    } catch (e) {}
  }

  // ---------- Fotocamera ----------
  const video = $('video');
  let stream = null, facing = 'environment', torchOn = false;

  async function startStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play();
    // Flash continuo: solo se il telefono lo permette (molti Android sì, iPhone no)
    torchOn = false; $('torch').classList.remove('on');
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('torch').classList.toggle('hidden', !caps.torch);
  }

  async function openCam() {
    initAudio();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('nativeCam').click(); return; }
    $('cam').classList.remove('hidden');
    renderChips(); applyPreview(); updateStatus();
    try { await startStream(); }
    catch (e) {
      closeCam();
      $('homeStatus').textContent = 'Fotocamera della pagina non disponibile: uso quella del telefono.';
      $('nativeCam').click();
    }
  }

  function closeCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $('cam').classList.add('hidden');
    updateStatus();
  }

  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1100);
  }

  let processing = Promise.resolve();
  function shoot() {
    if (!video.videoWidth) return;
    clickSound();
    const fl = $('flash'); fl.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('on')));

    // Cattura subito il fotogramma, poi elabora in coda (così si può scattare a raffica)
    const [w, h] = fit(video.videoWidth, video.videoHeight);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, w, h);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const f = filter, n = ++shots; store('shots', shots); updateStatus();

    processing = processing.then(async () => {
      try { await document.fonts.load('40px "VT323"'); } catch (e) {}
      applyFilter(c, f);
      const blob = await canvasToJpeg(c);
      if (!blob) { toast('Scatto non riuscito, riprova'); return; }
      $('thumb').style.backgroundImage = 'url(' + URL.createObjectURL(blob) + ')';
      enqueue({ blob, name: 'scatto_' + hhmmss() + '_' + f.id + '.jpg' });
    });
  }

  $('openCam').addEventListener('click', openCam);
  $('closeCam').addEventListener('click', closeCam);
  $('thumb').addEventListener('click', closeCam);
  $('shutter').addEventListener('click', shoot);
  $('flip').addEventListener('click', async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await startStream(); } catch (e) { toast('Impossibile cambiare fotocamera'); }
  });
  $('torch').addEventListener('click', async () => {
    try {
      torchOn = !torchOn;
      await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] });
      $('torch').classList.toggle('on', torchOn);
    } catch (e) { toast('Flash non disponibile'); }
  });

  updateStatus();
</script>
</body>
</html>
